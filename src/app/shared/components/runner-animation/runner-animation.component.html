<div class="marathon-visual-track">
  <div class="track-header">
    <div class="ribbon-badge">
      <!-- Breast Cancer Awareness Ribbon SVG -->
      <svg class="cancer-ribbon-svg" viewBox="0 0 100 120" width="36" height="42">
        <defs>
          <linearGradient id="ribbonPink" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f472b6" />
            <stop offset="50%" stop-color="#ec4899" />
            <stop offset="100%" stop-color="#be185d" />
          </linearGradient>
          <filter id="ribbonGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.35"/>
          </filter>
        </defs>
        <!-- Ribbon loop and tails -->
        <path class="ribbon-loop" d="M30,70 C15,50 20,20 50,20 C80,20 85,50 70,70 L85,110 L65,95 L50,80 L35,95 L15,110 Z" 
              fill="url(#ribbonPink)" filter="url(#ribbonGlow)" />
        <path class="ribbon-fold" d="M50,20 C65,20 75,35 70,55 C65,75 50,80 50,80 C50,80 35,75 30,55 C25,35 35,20 50,20 Z" 
              fill="#db2777" opacity="0.6" />
      </svg>
      <div class="campaign-pulse-tag">
        <span class="pulse-dot"></span>
        <span class="pulse-text">Awareness Live Track</span>
      </div>
    </div>

    <div class="track-status-summary">
      <span class="tag-title">Campaign Journey:</span>
      <span class="tag-desc">From Public Awareness to Crossing the Finish Line</span>
    </div>
  </div>

  <!-- Interactive Marathon Route Line with Animated Runner -->
  <div class="route-line-wrapper">
    <div class="route-milestones">
      <div class="milestone m-1 active">
        <div class="milestone-dot"><span class="material-symbols-outlined">flag</span></div>
        <span class="milestone-label">Awareness</span>
      </div>
      <div class="milestone m-2 active">
        <div class="milestone-dot"><span class="material-symbols-outlined">group</span></div>
        <span class="milestone-label">Leads In</span>
      </div>
      <div class="milestone m-3 active">
        <div class="milestone-dot"><span class="material-symbols-outlined">favorite</span></div>
        <span class="milestone-label">Interested</span>
      </div>
      <div class="milestone m-4 active">
        <div class="milestone-dot"><span class="material-symbols-outlined">sports_score</span></div>
        <span class="milestone-label">Registered</span>
      </div>
    </div>

    <!-- Dotted Curved Route Track -->
    <div class="track-svg-container">
      <svg class="track-svg" viewBox="0 0 800 40" preserveAspectRatio="none">
        <path class="track-bg-line" d="M 10 20 Q 200 5, 400 20 T 790 20" />
        <path class="track-progress-line" d="M 10 20 Q 200 5, 400 20 T 790 20" />
      </svg>

      <!-- Animated Runner Icon traveling along the track -->
      <div class="runner-figure">
        <div class="runner-avatar">
          <span class="material-symbols-outlined runner-icon">directions_run</span>
          <span class="runner-shadow"></span>
        </div>
      </div>
    </div>
  </div>
</div>
